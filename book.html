<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Libook</title>

<style>
body {
  background: #f5f1e6;
  font-family: serif;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 30px;
  box-shadow: 0 0 30px rgba(0,0,0,0.2);
}

img {
  width: 100%;
  height: 350px;
  object-fit: cover;
}

.actions {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}

button {
  padding: 8px 12px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <img id="img">
  <h1 id="title"></h1>
  <p id="author"></p>
  <p id="desc"></p>
  <p id="genres"></p>

  <div class="actions">
    <button onclick="editBook()">✏️ Edit</button>
    <button onclick="deleteBook()">🗑️ Delete</button>
  </div>

  <br>
  <a href="index.html">⬅ Back</a>
</div>

<script>
const BIN_ID="6a0fc1ebee5a733b12fc9522";
const API_KEY="$2a$10$QvJnLiGvVrc6k6ds.TiRNegZHNuZd1RYpQDEb6OXRuoPRh3kuEtRC";

const id=new URLSearchParams(location.search).get("id");

let data, book;

async function load(){
  const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    headers:{"X-Master-Key":API_KEY}
  });

  data=(await res.json()).record;
  book=data.books.find(b=>b.id==id);

  title.innerText=book.title;
  author.innerText=book.author;
  desc.innerText=book.description;
  genres.innerText=book.genres.join(", ");
  img.src=book.image;
}

function deleteBook(){
  if(confirm("Delete this book?")){
    data.books=data.books.filter(b=>b.id!=id);
    save();
  }
}

function editBook(){
  const newTitle=prompt("Edit title:", book.title);
  if(!newTitle) return;

  book.title=newTitle;
  save();
}

async function save(){
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Master-Key":API_KEY
    },
    body:JSON.stringify(data)
  });

  window.location.href="index.html";
}

load();
</script>

</body>
</html>
