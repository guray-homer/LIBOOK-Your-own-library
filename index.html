<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Libook</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=EB+Garamond&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'EB Garamond', serif;
      background: #f4ecd8;
      color: #3b2f2f;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 50%;
      width: 800px;
      height: 100%;
      transform: translateX(-50%);
      background: #fffaf0;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      z-index: -1;
    }

    h1 {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 42px;
      margin-bottom: 5px;
      letter-spacing: 3px;
    }

    .subtitle {
      text-align: center;
      font-style: italic;
      margin-bottom: 20px;
    }

    h2 {
      border-bottom: 2px solid #c2a878;
      padding-bottom: 5px;
      margin-top: 30px;
    }

    #featuredBooks {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    #featuredBooks div {
      background: #fffdf5;
      border: 1px solid #d6c7a1;
      padding: 15px;
      width: 200px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      border-radius: 6px;
      transition: transform 0.2s;
    }

    #featuredBooks div:hover {
      transform: scale(1.03);
    }

    #featuredBooks img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border: 1px solid #ccc;
    }

    form {
      background: repeating-linear-gradient(#fffdf5,#fffdf5 28px,#e6dcc2 29px);
      padding: 20px;
      border: 1px solid #d6c7a1;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
      width: 350px;
    }

    form input, form textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #999;
      background: transparent;
      font-family: 'EB Garamond', serif;
      font-size: 14px;
      padding: 5px;
      margin-bottom: 10px;
    }

    form textarea {
      height: 80px;
      resize: none;
    }

    button {
      padding: 10px;
      background: #8b6f47;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #6e5636;
    }

    a {
      text-decoration: none;
      color: #5a3e1b;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📖 Libook</h1>
<p class="subtitle">Your personal library, written like a book</p>

<h2>⭐ Featured Books</h2>
<div id="featuredBooks"></div>

<hr>

<h2>➕ Add New Book</h2>

<form id="bookForm">
  <input type="text" id="title" placeholder="Book Title" required>
  <input type="text" id="author" placeholder="Author" required>
  <input type="date" id="dateModified" required>
  <input type="text" id="ageGroup" placeholder="Age Group (e.g. 13+)" required>
  <input type="text" id="genres" placeholder="Genres (comma separated)" required>
  <input type="text" id="image" placeholder="Image URL" required>
  <textarea id="description" placeholder="Description" required></textarea>
  <label><input type="checkbox" id="featured"> Featured</label>
  <button type="submit">Add Book</button>
</form>

<script>
const BIN_ID = "6a0fc1ebee5a733b12fc9522";
const API_KEY = "$2a$10$QvJnLiGvVrc6k6ds.TiRNegZHNuZd1RYpQDEb6OXRuoPRh3kuEtRC";
const url = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let data = {};

async function fetchBooks() {
  const res = await fetch(url, {
    headers: { "X-Master-Key": API_KEY }
  });
  const json = await res.json();
  data = json.record;
  displayFeatured();
}

function displayFeatured() {
  const container = document.getElementById("featuredBooks");
  container.innerHTML = "";

  data.books.filter(book => book.featured).forEach(book => {
    const div = document.createElement("div");
    div.innerHTML = `
      <h3>${book.title}</h3>
      <p>${book.author}</p>
      <img src="${book.image}">
      <br>
      <a href="book.html?id=${book.id}">Read</a>
    `;
    container.appendChild(div);
  });
}

document.getElementById("bookForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const newBook = {
    id: Date.now(),
    title: title.value,
    author: author.value,
    dateModified: dateModified.value,
    ageGroup: ageGroup.value,
    genres: genres.value.split(",").map(g => g.trim()),
    image: image.value,
    description: description.value,
    featured: featured.checked
  };

  data.books.push(newBook);

  await fetch(url, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify(data)
  });

  alert("Book added!");
  fetchBooks();
  bookForm.reset();
});

fetchBooks();
</script>

</body>
</html>
