<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libook</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond&display=swap" rel="stylesheet">

<style>

/* 🌙 THEME */
body {
  margin: 0;
  font-family: 'EB Garamond', serif;
  background: linear-gradient(#fdf6e3, #f1e4c6);
  transition: 0.4s;
}

/* Dark mode */
body.dark {
  background: #1a1a1a;
  color: #eee;
}

/* 📜 Main paper */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  background: #fffdf7;
  box-shadow: 0 0 50px rgba(0,0,0,0.25);
  transition: 0.4s;
}

body.dark .container {
  background: #2a2a2a;
}

/* 📖 Header */
h1 {
  text-align: center;
  font-family: 'Cinzel';
  letter-spacing: 3px;
}

/* 🌙 Toggle */
.toggle {
  position: fixed;
  top: 15px;
  right: 15px;
  cursor: pointer;
  font-size: 20px;
}

/* 🔍 Search */
.search {
  width: 100%;
  padding: 10px;
  border: 1px solid #c8b68a;
  margin: 20px 0;
  background: transparent;
}

/* 🎨 Genres */
.genre-bar {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

.genre {
  border: 1px solid #c8b68a;
  padding: 5px 12px;
  cursor: pointer;
}

.genre.active {
  background: black;
  color: white;
}

/* 📚 Bookshelf illusion */
.books {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 25px;
  margin-top: 20px;
}

.book {
  background: #fff;
  border: 1px solid #d8cba5;
  padding: 10px;
  transform: perspective(600px) rotateY(0deg);
  transition: 0.3s;
}

.book:hover {
  transform: perspective(600px) rotateY(-8deg) scale(1.05);
}

/* Cover */
.book img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

/* Actions */
.actions {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

/* ✨ Floating button */
.add-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: black;
  color: white;
  width: 60px;
  height: 60px;
  font-size: 30px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

/* 🪟 Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal-content {
  background: #fffdf7;
  max-width: 400px;
  margin: 8% auto;
  padding: 20px;
  border: 1px solid #c8b68a;
  animation: openBook 0.4s ease;
}

/* 📖 Opening animation */
@keyframes openBook {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

/* Inputs */
input, textarea {
  width: 100%;
  border: none;
  border-bottom: 1px solid #c8b68a;
  margin-bottom: 10px;
  background: transparent;
}

/* 📱 Responsive */
@media(max-width:600px){
  h1 { font-size: 28px; }
}

</style>
</head>

<body>

<div class="toggle" onclick="toggleTheme()">🌙</div>

<div class="container">
  <h1>📖 Libook</h1>

  <input class="search" id="search" placeholder="Search books...">

  <div class="genre-bar" id="genreBar"></div>

  <div class="books" id="bookList"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <form id="bookForm">
      <input id="title" placeholder="Title" required>
      <input id="author" placeholder="Author">
      <input id="genres" placeholder="Genres">
      <input id="image" placeholder="Image URL">
      <textarea id="description" placeholder="Description"></textarea>
      <button>Save</button>
    </form>
  </div>
</div>

<script>
const BIN_ID="6a0fc1ebee5a733b12fc9522";
const API_KEY="$2a$10$QvJnLiGvVrc6k6ds.TiRNegZHNuZd1RYpQDEb6OXRuoPRh3kuEtRC";

let data, currentGenre="All";

/* Theme */
function toggleTheme(){
  document.body.classList.toggle("dark");
}

/* Load */
async function load(){
  const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    headers:{"X-Master-Key":API_KEY}
  });
  data=(await res.json()).record;
  renderGenres();
  renderBooks();
}

function renderGenres(){
  genreBar.innerHTML=`<div class="genre ${currentGenre==='All'?'active':''}" onclick="setGenre('All')">All</div>`;
  data.genres.forEach(g=>{
    genreBar.innerHTML+=`<div class="genre" onclick="setGenre('${g}')">${g}</div>`;
  });
}

function renderBooks(){
  let list=data.books;

  if(currentGenre!=="All")
    list=list.filter(b=>b.genres.includes(currentGenre));

  const search=searchInput.value.toLowerCase();
  list=list.filter(b=>b.title.toLowerCase().includes(search));

  bookList.innerHTML=list.map(b=>`
    <div class="book">
      <img src="${b.image}">
      <h3>${b.title}</h3>
      <div class="actions">
        <a href="book.html?id=${b.id}">Open</a>
      </div>
    </div>
  `).join("");
}

function setGenre(g){
  currentGenre=g;
  renderBooks();
}

searchInput.oninput=renderBooks;

/* Modal */
function openModal(){ modal.style.display="block"; }

window.onclick=e=>{
  if(e.target.id==="modal") modal.style.display="none";
};

bookForm.onsubmit=async e=>{
  e.preventDefault();

  const book={
    id:Date.now(),
    title:title.value,
    author:author.value,
    genres:genres.value.split(","),
    image:image.value,
    description:description.value
  };

  data.books.push(book);

  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Master-Key":API_KEY
    },
    body:JSON.stringify(data)
  });

  modal.style.display="none";
  load();
};

load();
</script>

</body>
</html>
