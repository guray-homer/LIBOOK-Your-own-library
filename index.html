<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Libook</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: #f5f1e6;
  color: #111;
}

/* 📜 Paper container */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* Title */
h1 {
  text-align: center;
  font-family: 'Special Elite';
  font-size: 42px;
  border-bottom: 2px dashed black;
}

/* 🔍 Search */
.search {
  margin: 15px 0;
  width: 100%;
  padding: 8px;
  border: 1px solid black;
  background: transparent;
}

/* 🎨 Genre bar */
.genre-bar {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 2px solid black;
}

.genre {
  padding: 6px 12px;
  border: 1px solid black;
  cursor: pointer;
}

.genre.active {
  background: black;
  color: white;
}

/* 📚 Bookshelf */
.books {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.book {
  border: 2px solid black;
  padding: 8px;
  background: white;
  position: relative;
}

.book img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border: 1px solid black;
}

.book h3 {
  font-size: 14px;
}

.actions {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}

/* ➕ Button */
.add-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: black;
  color: white;
  font-size: 30px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

/* 🪟 Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
}

.modal-content {
  background: white;
  max-width: 400px;
  margin: 5% auto;
  padding: 20px;
  border: 2px solid black;
}

/* Inputs */
input, textarea {
  width: 100%;
  margin-bottom: 10px;
  border: none;
  border-bottom: 1px solid black;
  background: transparent;
}

/* doodles */
.doodle {
  position: absolute;
  font-size: 20px;
  opacity: 0.2;
}

</style>
</head>

<body>

<div class="container">
  <h1>📖 Libook</h1>

  <input class="search" id="search" placeholder="Search books...">

  <div class="genre-bar" id="genreBar"></div>

  <div class="books" id="bookList"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Add Book</h3>
    <form id="bookForm">
      <input id="title" placeholder="Title" required>
      <input id="author" placeholder="Author" required>
      <input type="date" id="dateModified">
      <input id="ageGroup" placeholder="Age">
      <input id="genres" placeholder="Genres comma">
      <input id="image" placeholder="Image URL">
      <textarea id="description" placeholder="Description"></textarea>
      <button>Save</button>
    </form>
  </div>
</div>

<script>
const BIN_ID = "6a0fc1ebee5a733b12fc9522";
const API_KEY = "$2a$10$QvJnLiGvVrc6k6ds.TiRNegZHNuZd1RYpQDEb6OXRuoPRh3kuEtRC";

let data, editId = null, currentGenre = "All";

async function load() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    headers: {"X-Master-Key": API_KEY}
  });

  data = (await res.json()).record;
  renderGenres();
  renderBooks();
}

function renderGenres() {
  let html = `<div class="genre ${currentGenre==='All'?'active':''}" onclick="setGenre('All')">All</div>`;
  data.genres.forEach(g=>{
    html += `<div class="genre ${currentGenre===g?'active':''}" onclick="setGenre('${g}')">${g}</div>`;
  });
  genreBar.innerHTML = html;
}

function renderBooks() {
  let list = data.books;

  if(currentGenre!=="All")
    list = list.filter(b=>b.genres.includes(currentGenre));

  const search = document.getElementById("search").value.toLowerCase();
  list = list.filter(b => b.title.toLowerCase().includes(search));

  bookList.innerHTML = list.map(b=>`
    <div class="book">
      <span class="doodle">✏️</span>
      <img src="${b.image}">
      <h3>${b.title}</h3>
      <p>${b.author}</p>
      <div class="actions">
        <a href="book.html?id=${b.id}">Read</a>
        <span onclick="editBook(${b.id})">✏️</span>
        <span onclick="deleteBook(${b.id})">🗑️</span>
      </div>
    </div>
  `).join("");
}

function setGenre(g){
  currentGenre = g;
  renderGenres();
  renderBooks();
}

search.oninput = renderBooks;

function openModal(){
  modal.style.display="block";
}

window.onclick = e=>{
  if(e.target.id==="modal") modal.style.display="none";
}

bookForm.onsubmit = async e=>{
  e.preventDefault();

  const book = {
    id: editId || Date.now(),
    title: title.value,
    author: author.value,
    dateModified: dateModified.value,
    ageGroup: ageGroup.value,
    genres: genres.value.split(",").map(g=>g.trim()),
    image: image.value,
    description: description.value
  };

  if(editId){
    data.books = data.books.map(b=>b.id===editId?book:b);
  } else {
    data.books.push(book);
  }

  await save();
  modal.style.display="none";
  editId=null;
};

function editBook(id){
  const b = data.books.find(x=>x.id===id);
  editId=id;
  title.value=b.title;
  author.value=b.author;
  dateModified.value=b.dateModified;
  ageGroup.value=b.ageGroup;
  genres.value=b.genres.join(",");
  image.value=b.image;
  description.value=b.description;
  openModal();
}

function deleteBook(id){
  if(confirm("Delete this book?")){
    data.books = data.books.filter(b=>b.id!==id);
    save();
  }
}

async function save(){
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Master-Key":API_KEY
    },
    body:JSON.stringify(data)
  });
  load();
}

load();
</script>

</body>
</html>
