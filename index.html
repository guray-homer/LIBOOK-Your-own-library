<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Libook</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: #f5f1e6;
  color: #111;
}

/* 📜 Paper texture */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* Title */
h1 {
  text-align: center;
  font-family: 'Special Elite', cursive;
  font-size: 40px;
  border-bottom: 2px dashed black;
  padding-bottom: 10px;
}

/* 🎨 Genre bar */
.genre-bar {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 2px solid black;
}

.genre {
  padding: 6px 12px;
  border: 1px solid black;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}

.genre:hover {
  background: black;
  color: white;
}

/* 📚 Books */
.books {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.book {
  border: 1px solid black;
  padding: 10px;
  background: #fff;
}

.book img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border: 1px solid black;
}

.book h3 {
  margin: 5px 0;
  font-size: 16px;
}

.book p {
  font-size: 12px;
}

/* ➕ Floating button */
.add-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: black;
  color: white;
  font-size: 30px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

/* 🪟 Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
}

.modal-content {
  background: #fff;
  max-width: 400px;
  margin: 10% auto;
  padding: 20px;
  border: 2px solid black;
}

/* Inputs */
.modal input, .modal textarea {
  width: 100%;
  margin-bottom: 10px;
  border: none;
  border-bottom: 1px solid black;
  background: transparent;
}

button {
  padding: 8px;
  border: 1px solid black;
  background: white;
  cursor: pointer;
}

button:hover {
  background: black;
  color: white;
}
</style>
</head>

<body>

<div class="container">
  <h1>📖 Libook</h1>

  <div class="genre-bar" id="genreBar"></div>

  <div class="books" id="bookList"></div>
</div>

<button class="add-btn" onclick="openModal()">+</button>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Book</h3>
    <form id="bookForm">
      <input type="text" id="title" placeholder="Title" required>
      <input type="text" id="author" placeholder="Author" required>
      <input type="date" id="dateModified" required>
      <input type="text" id="ageGroup" placeholder="Age Group">
      <input type="text" id="genres" placeholder="Genres (comma)">
      <input type="text" id="image" placeholder="Image URL">
      <textarea id="description" placeholder="Description"></textarea>
      <label><input type="checkbox" id="featured"> Featured</label>
      <button type="submit">Save</button>
    </form>
  </div>
</div>

<script>
const BIN_ID = "6a0fc1ebee5a733b12fc9522";
const API_KEY = "$2a$10$QvJnLiGvVrc6k6ds.TiRNegZHNuZd1RYpQDEb6OXRuoPRh3kuEtRC";
const url = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let data = {};
let currentGenre = "All";

async function fetchData() {
  const res = await fetch(url, {
    headers: { "X-Master-Key": API_KEY }
  });
  const json = await res.json();
  data = json.record;

  renderGenres();
  renderBooks();
}

function renderGenres() {
  const bar = document.getElementById("genreBar");
  bar.innerHTML = `<div class="genre" onclick="filterGenre('All')">All</div>`;

  data.genres.forEach(g => {
    bar.innerHTML += `<div class="genre" onclick="filterGenre('${g}')">${g}</div>`;
  });
}

function renderBooks() {
  const list = document.getElementById("bookList");
  list.innerHTML = "";

  let books = data.books;
  if (currentGenre !== "All") {
    books = books.filter(b => b.genres.includes(currentGenre));
  }

  books.forEach(book => {
    list.innerHTML += `
      <div class="book">
        <img src="${book.image}">
        <h3>${book.title}</h3>
        <p>${book.author}</p>
        <a href="book.html?id=${book.id}">Read</a>
      </div>
    `;
  });
}

function filterGenre(g) {
  currentGenre = g;
  renderBooks();
}

function openModal() {
  document.getElementById("modal").style.display = "block";
}

window.onclick = function(e) {
  if (e.target.id === "modal") {
    document.getElementById("modal").style.display = "none";
  }
};

document.getElementById("bookForm").addEventListener("submit", async e => {
  e.preventDefault();

  const newBook = {
    id: Date.now(),
    title: title.value,
    author: author.value,
    dateModified: dateModified.value,
    ageGroup: ageGroup.value,
    genres: genres.value.split(",").map(g => g.trim()),
    image: image.value,
    description: description.value,
    featured: featured.checked
  };

  data.books.push(newBook);

  await fetch(url, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify(data)
  });

  document.getElementById("modal").style.display = "none";
  fetchData();
});

fetchData();
</script>

</body>
</html>
